<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account - CampusFix</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="auth-body">
  <div class="auth-wrapper">
    <div class="auth-container">
      <!-- Brand Header -->
      <div class="auth-brand">
        <div class="auth-brand-icon">🛠️</div>
        <h1 class="auth-brand-title">CampusFix</h1>
        <p class="auth-brand-subtitle">Campus Facilities & Maintenance Portal</p>
      </div>

      <!-- Main Register Card -->
      <div class="card auth-card">
        <div class="card-header auth-card-header">
          <h2 class="card-title">Create User Account</h2>
          <p class="card-subtitle">Register to submit and track maintenance requests</p>
        </div>

        {% if error %}
        <div class="alert alert-error" id="registerAlert">
          <span class="alert-icon">⚠️</span>
          <span>{{ error }}</span>
        </div>
        {% endif %}

        <!-- Registration Form -->
        <form action="/register" method="POST" class="auth-form" id="registerForm">
          <div class="form-group">
            <label for="nameInput" class="form-label">Full Name <span class="required">*</span></label>
            <input 
              type="text" 
              id="nameInput" 
              name="name" 
              class="form-control" 
              placeholder="e.g. John Doe or Priya Sharma" 
              value="{{ name or '' }}"
              required 
              autofocus
            >
          </div>

          <div class="form-group">
            <label for="regUsernameInput" class="form-label">Username <span class="required">*</span></label>
            <input 
              type="text" 
              id="regUsernameInput" 
              name="username" 
              class="form-control" 
              placeholder="e.g. jdoe24" 
              value="{{ username or '' }}"
              required
            >
          </div>

          <div class="form-group">
            <label for="regPasswordInput" class="form-label">Password <span class="required">*</span></label>
            <input 
              type="password" 
              id="regPasswordInput" 
              name="password" 
              class="form-control" 
              placeholder="At least 4 characters" 
              required
            >
          </div>

          <div class="form-actions" style="margin-top: 1.25rem;">
            <button type="submit" class="btn btn-primary btn-block" id="registerSubmitBtn">
              Create Account
            </button>
          </div>
        </form>

        <!-- Footer / Login Link -->
        <div class="auth-card-footer">
          <p>Already have an account? <a href="/login" class="auth-link">Sign in instead</a></p>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
