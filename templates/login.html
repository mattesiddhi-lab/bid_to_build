<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - CampusFix Maintenance Portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="auth-body">
  <div class="auth-wrapper">
    <div class="auth-container">
      <!-- Brand Header -->
      <div class="auth-brand">
        <div class="auth-brand-icon">🛠️</div>
        <h1 class="auth-brand-title">CampusFix</h1>
        <p class="auth-brand-subtitle">Campus Facilities & Maintenance Portal</p>
      </div>

      <!-- Main Login Card -->
      <div class="card auth-card">
        <div class="card-header auth-card-header">
          <h2 class="card-title">Sign In</h2>
          <p class="card-subtitle">Log in to report issues or manage maintenance work orders</p>
        </div>

        {% if error %}
        <div class="alert alert-error" id="loginAlert">
          <span class="alert-icon">⚠️</span>
          <span>{{ error }}</span>
        </div>
        {% endif %}

        {% if success_msg %}
        <div class="alert alert-success" id="loginSuccessAlert">
          <span class="alert-icon">✓</span>
          <span>{{ success_msg }}</span>
        </div>
        {% endif %}

        <!-- Standard Login Form -->
        <form action="/login" method="POST" class="auth-form" id="loginForm">
          <div class="form-group">
            <label for="usernameInput" class="form-label">Username</label>
            <input 
              type="text" 
              id="usernameInput" 
              name="username" 
              class="form-control" 
              placeholder="e.g. admin or student" 
              value="{{ username or '' }}"
              required 
              autofocus
            >
          </div>

          <div class="form-group">
            <label for="passwordInput" class="form-label">Password</label>
            <input 
              type="password" 
              id="passwordInput" 
              name="password" 
              class="form-control" 
              placeholder="Enter your password" 
              required
            >
          </div>

          <div class="form-actions" style="margin-top: 1.25rem;">
            <button type="submit" class="btn btn-primary btn-block" id="loginSubmitBtn">
              Sign In
            </button>
          </div>
        </form>

        <!-- Footer / Register Link -->
        <div class="auth-card-footer">
          <p>Don't have an account? <a href="/register" class="auth-link">Create a User account</a></p>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
