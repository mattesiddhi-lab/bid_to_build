<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#bg)" />
  <!-- Chair backrest -->
  <rect x="230" y="110" width="140" height="110" rx="12" fill="#dc2626" stroke="#991b1b" stroke-width="4" />
  <!-- Damaged torn fabric -->
  <path d="M 260 140 Q 280 170 270 190 Q 300 180 320 200" stroke="#fecaca" stroke-width="4" fill="none" />
  <!-- Broken detached armrest -->
  <rect x="180" y="200" width="110" height="20" rx="6" fill="#475569" transform="rotate(25 180 200)" />
  <rect x="330" y="200" width="90" height="20" rx="6" fill="#475569" />
  <!-- Seat base -->
  <rect x="210" y="220" width="180" height="40" rx="8" fill="#b91c1c" />
  <!-- Legs -->
  <line x1="240" y1="260" x2="210" y2="340" stroke="#64748b" stroke-width="10" stroke-linecap="round" />
  <line x1="360" y1="260" x2="390" y2="340" stroke="#64748b" stroke-width="10" stroke-linecap="round" />
  <!-- Loose screws -->
  <circle cx="195" cy="300" r="5" fill="#facc15" />
  <circle cx="215" cy="315" r="4" fill="#facc15" />
  <text x="300" y="370" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="16" font-weight="600" text-anchor="middle">Auditorium Row H - Broken Armrest & Cushion Tear</text>
</svg>
