<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="tile" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="pipe" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8" />
      <stop offset="50%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#64748b" />
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#tile)" />
  <!-- Pipe network -->
  <rect x="80" y="160" width="440" height="40" rx="6" fill="url(#pipe)" />
  <rect x="270" y="160" width="60" height="120" rx="4" fill="url(#pipe)" />
  <circle cx="300" cy="180" r="16" fill="#475569" stroke="#334155" stroke-width="3" />
  <!-- Water leak spray -->
  <path d="M 285 280 C 270 300 240 320 210 330" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.8"/>
  <path d="M 300 280 C 300 310 295 330 290 350" stroke="#0ea5e9" stroke-width="6" stroke-linecap="round" fill="none" opacity="0.9"/>
  <path d="M 315 280 C 330 300 360 320 380 335" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.8"/>
  <!-- Puddle -->
  <ellipse cx="300" cy="350" rx="140" ry="25" fill="#0284c7" opacity="0.6" />
  <ellipse cx="300" cy="350" rx="110" ry="18" fill="#38bdf8" opacity="0.7" />
  <text x="300" y="90" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="16" font-weight="600" text-anchor="middle">Hostel B - Ground Floor Pipe Rupture</text>
</svg>
